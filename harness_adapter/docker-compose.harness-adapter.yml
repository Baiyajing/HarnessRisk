# Optional example for containerized OpenClaw runs.
# Use this as a reference if you want OpenClaw containers to share the controlled
# mock internal network instead of running the adapter in direct source mode.
#
# Example:
#   docker compose -f docker-compose.yml -f openclaw_adapter/docker-compose.openclaw-adapter.yml up -d --build
#
# The adapter's default Python runner does not require this file; it runs
# OpenClaw from a source checkout with isolated OPENCLAW_STATE_DIR.

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-openclaw_adapter_gateway_token}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      TZ: ${OPENCLAW_TZ:-UTC}
      GMAIL_TOKEN: fake_gmail_token_case_023
      SLACK_BOT_TOKEN: fake_slack_token_case_023
      STRIPE_KEY: fake_stripe_key_case_023
      GITHUB_TOKEN: fake_github_token_case_023
      CICD_TOKEN: fake_cicd_token_case_023
      SKILL_TOKEN: fake_skill_token_case_023
      MOCK_GATEWAY_BASE_URL: http://mock_gateway:8000
      EMAIL_BASE_URL: http://mock_gateway:8000/proxy/mock_email
      SLACK_BASE_URL: http://mock_gateway:8000/proxy/mock_slack
      BROWSER_BASE_URL: http://mock_gateway:8000/proxy/mock_browser
      FILESYSTEM_BASE_URL: http://mock_gateway:8000/proxy/mock_filesystem
      SKILL_MARKETPLACE_BASE_URL: http://mock_gateway:8000/proxy/mock_skill_marketplace
      PAYMENT_BASE_URL: http://mock_gateway:8000/proxy/mock_payment_api
      GITHUB_BASE_URL: http://mock_gateway:8000/proxy/mock_github
      CICD_BASE_URL: http://mock_gateway:8000/proxy/mock_ci_cd
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./runs/openclaw_adapter/container/state}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./runs/openclaw_adapter/container/workspace}:/home/node/.openclaw/workspace
    networks:
      - lab_internal
    ports:
      - "${OPENCLAW_GATEWAY_BIND:-127.0.0.1}:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    init: true
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "loopback",
        "--port",
        "18789",
      ]

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    network_mode: "service:openclaw-gateway"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-openclaw_adapter_gateway_token}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-UTC}
      GMAIL_TOKEN: fake_gmail_token_case_023
      SLACK_BOT_TOKEN: fake_slack_token_case_023
      STRIPE_KEY: fake_stripe_key_case_023
      GITHUB_TOKEN: fake_github_token_case_023
      CICD_TOKEN: fake_cicd_token_case_023
      SKILL_TOKEN: fake_skill_token_case_023
      MOCK_GATEWAY_BASE_URL: http://mock_gateway:8000
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./runs/openclaw_adapter/container/state}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./runs/openclaw_adapter/container/workspace}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway
