services:
  mock_email:
    build: .
    command: ["python", "-m", "services.mock_email.app"]
    environment:
      DEFAULT_CASE_ID: ${DEFAULT_CASE_ID:-case_023}
    volumes:
      - mock_lab_data:/data
      - ./cases:/seed/cases:ro
    networks: [lab_internal]
    expose: ["8000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  mock_slack:
